# Publica o site a cada envio para a branch main:
# - site oficial na Hostinger (ieasyoficial.com), por FTP. Configuração em
#   Settings → Secrets and variables → Actions:
#     Variables: FTP_SERVER, FTP_USERNAME (e FTP_DIR, se a pasta não for public_html/)
#     Secrets:   FTP_PASSWORD
# - no GitHub Pages fica só um redirecionamento: links antigos da prévia
#   (c0nt1n.github.io/ieasy-site/...) levam para a mesma página em ieasyoficial.com.
name: Publicar o site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# um envio por vez, sem interromper um envio para a Hostinger no meio
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # a mesma página serve para o endereço inicial e para qualquer outro (404.html)
      - run: mkdir redirect && cp .github/pages-redirect/index.html redirect/index.html && cp .github/pages-redirect/index.html redirect/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  hostinger:
    if: vars.FTP_SERVER != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://ieasyoficial.com
          BASE_PATH: /
      # Envia com o lftp do Ubuntu, com a conexão criptografada (FTPS).
      # ssl:verify-certificate no: o certificado da Hostinger é de *.hstgr.io, não do IP, então o nome
      # não é conferido (a conexão continua criptografada).
      # 1) arquivos novos de /_astro/ (nomes mudam a cada versão); 2) páginas e demais arquivos;
      # 3) por último, apaga de /_astro/ o que a versão nova não usa mais.
      - name: Enviar para a Hostinger
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR || 'public_html/' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null
          lftp -c "
            set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no;
            set net:max-retries 3; set net:timeout 30;
            open --env-password -u \"$FTP_USERNAME\" \"$FTP_SERVER\";
            cd \"$FTP_DIR\";
            mirror -R --ignore-time --parallel=4 dist/_astro/ _astro/;
            mirror -R --exclude-glob _astro/ --parallel=4 dist/ ./;
            mirror -R --ignore-time --delete --parallel=4 dist/_astro/ _astro/;
          "
