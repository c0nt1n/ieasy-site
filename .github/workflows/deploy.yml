# Publica o site a cada envio para a branch main:
# - prévia no GitHub Pages (Settings → Pages → Source: GitHub Actions);
# - site oficial na Hostinger (ieasyoficial.com), por FTP. Esse envio só roda depois de
#   configurar em Settings → Secrets and variables → Actions:
#     Variables: FTP_SERVER, FTP_USERNAME (e FTP_DIR, se a pasta não for public_html/)
#     Secrets:   FTP_PASSWORD
name: Publicar o site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  hostinger:
    if: vars.FTP_SERVER != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://ieasyoficial.com
          BASE_PATH: /
      # Envia só o que mudou desde o último envio, com a conexão criptografada (FTPS).
      # "loose": o certificado da Hostinger é de *.hstgr.io, não do IP, então o nome não é conferido.
      # travado no commit exato da v4.3.5 (não muda sozinho se a ferramenta for alterada)
      - uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65
        with:
          server: ${{ vars.FTP_SERVER }}
          username: ${{ vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DIR || 'public_html/' }}
